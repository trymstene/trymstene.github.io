<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Etsy connection</title>
<!--
  🛍 Where Etsy sends the shop owner after "Allow" (tools/etsy.mjs login). Etsy only returns to an https:// address
  registered on the app, so a local one cannot catch it: this page shows the one-time code for pasting back into the
  terminal. It loads nothing, sends nothing, and tells no analytics about the address it was opened with. The code is
  useless on its own: the exchange needs the PKCE verifier, which never leaves the terminal that asked.
-->
<style>
  :root { --banana: #ffe135; --ink: #111; --paper: #fffdf5; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--banana);
    color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: min(100%, 560px); background: var(--paper); border: 4px solid var(--ink); border-radius: 14px;
    box-shadow: 8px 8px 0 var(--ink); padding: 24px; }
  h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
  p { margin: 0.4rem 0; }
  code { display: block; margin: 14px 0; padding: 12px; background: #fff; border: 2px solid var(--ink); border-radius: 8px;
    font: 14px/1.4 ui-monospace, Consolas, monospace; word-break: break-all; user-select: all; }
  button { font: inherit; font-weight: 800; padding: 10px 18px; border: 3px solid var(--ink); border-radius: 999px;
    background: var(--banana); color: var(--ink); box-shadow: 3px 3px 0 var(--ink); cursor: pointer; }
  button:focus-visible { outline: 3px solid #2f6fd0; outline-offset: 3px; }
  small { opacity: 0.7; }
  .err { color: #b00020; font-weight: 700; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="h">Etsy said yes</h1>
  <div id="ok" hidden>
    <p>Copy this code and paste it into the terminal where you ran <b>node tools/etsy.mjs login</b>:</p>
    <code id="code"></code>
    <button id="copy" type="button">Copy the code</button>
    <p id="done" hidden>Copied. You can close this tab.</p>
  </div>
  <p id="bad" class="err" hidden></p>
  <p><small>This page only shows the code. It sends nothing anywhere, and the code is useless without the secret that
    stays in your terminal.</small></p>
</main>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var code = q.get('code');
    var err = q.get('error');
    if (code) {
      document.getElementById('code').textContent = code;
      document.getElementById('ok').hidden = false;
      document.getElementById('copy').addEventListener('click', function () {
        var select = function () {
          var r = document.createRange();
          r.selectNodeContents(document.getElementById('code'));
          var s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
        };
        if (navigator.clipboard) {
          navigator.clipboard.writeText(code).then(function () { document.getElementById('done').hidden = false; }, select);
        } else {
          select();
        }
      });
    } else {
      document.getElementById('h').textContent = 'No code here';
      var b = document.getElementById('bad');
      b.textContent = err ? 'Etsy said: ' + (q.get('error_description') || err) : 'Start from the terminal: node tools/etsy.mjs login';
      b.hidden = false;
    }
  })();
</script>
</body>
</html>
