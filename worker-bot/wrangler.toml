# 🍌📌 BananaBOT — Banana World's helper in the Discord. Deploy: `node tools/discord.mjs deploy` (it reads the keys from
# tools/discord.local.json and keeps them out of git and out of chat). Secrets: DISCORD_TOKEN, ANTHROPIC_KEY,
# BOT_ADMIN_TOKEN, BOT_STATS_TOKEN.
name = "banana-bot"
main = "src/index.js"
compatibility_date = "2026-06-01"

[[durable_objects.bindings]]
name = "BOT"
class_name = "BotRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BotRoom"]

# the world's own workers, asked directly (a worker on workers.dev calling another one's public address can be refused)
[[services]]
binding = "RAVE"
service = "banana-rave"

[[services]]
binding = "PASS"
service = "banana-pass"

[[services]]
binding = "SHARE"
service = "banana-share"

# Workers Paid only: a Free account refuses this deploy, so a deploy that lands proves the plan the gateway needs
[limits]
cpu_ms = 30000

[vars]
DISCORD_APP_ID = "1555181127012978709"
# Discord's PUBLIC verification key for this app — public by design (it checks Discord's signature, it signs nothing)
DISCORD_PUBLIC_KEY = "c108d5123e731d9266a473e0190a356d2cf31ef8c021a17c08d886afb171c8e0"
# ⚠️ "1" only on Workers Paid: the always-on connection keeps one Durable Object awake around the clock (bot-room.js)
GATEWAY_ON = "1"
DAILY_CAP = "80"
USER_CAP = "8"

[triggers]
crons = ["*/5 * * * *"]
