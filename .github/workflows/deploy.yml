name: Deploy to GitHub Pages

# Builds the Astro site and deploys it via the Pages ARTIFACT path
# (upload-pages-artifact + deploy-pages). Requires: repo Settings → Pages →
# Source = "GitHub Actions" (flipped via API on 6 Aug).
#
# WHY artifact-based (again): the branch path's internal
# "pages build and deployment" pipeline failed 6 consecutive deploys on
# 6 Aug 2026 — deployments stuck in deployment_queued until timeout, Pages
# API reporting status:errored, builds green, githubstatus.com silent.
# Mirror image of 3 Jul 2026, when the ARTIFACT path failed the same way and
# branch-based was the fix. The two paths fail in independent waves; when one
# jams, switch to the other. dist/ carries CNAME + .nojekyll from public/.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # daily rebuild at 00:05 UTC: the Banana of the Day page's crawlable text
  # changes with the date, and IndexNow gets pinged — a static site that
  # visibly lives. (Also refreshes shop data from Shopify daily.)
  schedule:
    - cron: '5 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Latest push wins: cancel any in-progress deploy. (A Pages-side stall on
# 2 Jul 2026 left a deploy job hung for 13h; with cancel-in-progress: false
# every new push queued behind it forever. Cancelling is safe — deploys are
# atomic and a newer push always carries the full site.)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # IndexNow: tell Bing/DuckDuckGo/Seznam etc. the site changed (minutes
      # instead of weeks). Google ignores it; harmless if the ping fails.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "trymstene.com",
              "key": "a68abc54470f9a4662b2bbc53c2c0ab2",
              "keyLocation": "https://trymstene.com/a68abc54470f9a4662b2bbc53c2c0ab2.txt",
              "urlList": [
                "https://trymstene.com/",
                "https://trymstene.com/dancing-banana-gif-meme/",
                "https://trymstene.com/make-a-banana/",
                "https://trymstene.com/dancing-banana-emoji/",
                "https://trymstene.com/peanut-butter-jelly-time/",
                "https://trymstene.com/license-the-dancing-banana/",
                "https://trymstene.com/shop/"
              ]
            }'
