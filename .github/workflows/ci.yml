name: CI gates

# 🤖 Rig step 1 (Dev Desk issue #1): the quality gates every change must pass.
#   1. every script parses (node --check — the class of bug that broke the
#      rave twice via a stray backtick)
#   2. the site builds
#   3. per-surface JS budgets hold, measured on the BUILT output
#      (tools/budgets.json — the static-import back door means only dist
#      tells the truth). Raising a budget is a deliberate act for a PR
#      description, never a drive-by.
# Runs on every PR (the Dev Desk shows these checks live) and on main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax gate — every script parses
        run: |
          set -e
          for f in $(find src/scripts src/lib shared worker/src worker-contact/src worker-pass/src worker-pulse/src worker-rave/src worker-share/src -name '*.js' -o -name '*.mjs' 2>/dev/null); do
            node --check "$f" || { echo "❌ $f"; exit 1; }
          done
          echo "✅ all scripts parse"
      - name: Build gate
        run: npm run build
      - name: Budget gate — built JS per surface
        run: node tools/check-budgets.mjs
      - name: Design gate — the mechanical half of docs/design-library.md
        run: node tools/check-design.mjs
      - name: Storage gate — every key on a player's device is declared
        run: node tools/check-storage.mjs
      - name: Pulse gate — the world page titles the live counter matches on
        run: node tools/check-pulse-areas.mjs
      - name: Copy gate — the mechanical half of docs/voice.md, on every approved line
        run: node tools/check-copy.mjs
      - name: Toast gate — no words typed straight into say/toast/passToast/bigMoment
        run: node tools/check-literal-says.mjs
      - name: generated blocks in sync (worker allowlists, stand prices, stand ids)
        run: node tools/build-worker-allowlists.mjs --check
      # 🧪 every worker's own in-process tests (22 Sep 2026): no workflow ran them, and jobs.test.mjs sat at five
      # failing checks while the job it tests was erased by every sync. Judged by exit code AND printed fail count.
      - name: Worker tests — every worker's own tests, against its fakes
        run: node tools/run-worker-tests.mjs
