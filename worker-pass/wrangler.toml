name = "banana-pass"
main = "src/index.js"
compatibility_date = "2026-06-01"

# The pass-sync worker: WebAuthn-gated cross-device sync for the Banana Pass.
# Own worker + own bucket = own blast radius (never mixes with payments/shares).
# Free plan, fails closed. Consider an R2 lifecycle on pass/ (e.g. 540 days
# since last write) as stale-pass insurance.

[[r2_buckets]]
binding = "PASSES"
bucket_name = "banana-passes"

[vars]
ALLOWED_ORIGIN = "https://trymstene.com,http://localhost:8803"
# Challenge-freshness HMAC. Repo-visible = challenges are forgeable in theory,
# which only enables assertion replay (needs a TLS break to capture one — not
# this site's threat model). Upgrade any time with:
#   npx wrangler secret put PASS_HMAC   (the secret overrides this var)
PASS_HMAC = "banana-world-challenge-stamp-v1"
# 📣 the news list, on or off. A plain var, not a secret — there is nothing
# sensitive in it, and it should be visible in the repo that a marketing rail
# is switched on. Set to "" and /news/join refuses with 503 and the opt-in on
# /pass/ says so, rather than quietly collecting addresses nobody can mail.
NEWS_OPEN = "1"
# 📏 the per-area faucet rules (2 Sep 2026). "0" = a homestead coin event that
# names no faucet is still accepted (counted `unruled` on the desk); "1" =
# refused. Flip once the desk shows unruled at ~0 for a day.
RULES_STRICT = "0"
# 🎩 stand ownership through an accepted spend (2 Sep 2026). "0" = a stand
# spend that names no item (a tab on pre-slice JS) is adopted as before and
# counted ownLegacy on the desk; "1" = refused (nobody is charged for an item
# they will not get). Flip once the desk shows ownLegacy at ~0 for a day.
OWN_STRICT = "1"   # flipped 3 Sep 2026 in the QA batch: the pre-slice builds never named the stand anyway
