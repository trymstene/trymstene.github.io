# Banana Pulse — Trym's private realtime GA4 dashboard.
# Token-gated (DASH_TOKEN secret); the GA4 service-account key lives ONLY as
# a worker secret (GA4_KEY). Never linked from the site, X-Robots-Tag: noindex
# on every response. SEPARATE worker (blast radius rule).
#
# Deploy: cd worker-pulse && npx wrangler deploy
# Secrets: wrangler secret put GA4_KEY   (the service-account JSON)
#          wrangler secret put DASH_TOKEN (the door key)

name = "banana-pulse"
main = "src/index.js"
compatibility_date = "2026-06-01"

[vars]
PROPERTY_ID = "358694050"
GSC_SITE = "https://trymstene.com/"

# ⚠️ A SERVICE BINDING, NOT A FETCH. A Worker fetching a *.workers.dev URL on
# the same account does not reach the other Worker — it loops back into THIS
# one, which 404s anything without its own token. That 404 is indistinguishable
# from adminRollup refusing a key, and it cost three key rotations to find.
# Worker-to-worker goes over a binding; the hostname in the Request is ignored.
[[services]]
binding = "PASS"
service = "banana-pass"
