# Banana rave worker — the realtime dance floor. One Durable Object = the
# room; presence only (join/leave/emotes). Animation needs NO server traffic:
# every client dances in sync off the wall clock.
# SEPARATE from the payment worker (blast radius rule) and the share worker.
# Free-plan friendly: SQLite-backed DO class + WebSocket hibernation = fails
# closed at the free ceilings, can never bill.
#
# Deploy: cd worker-rave && npx wrangler deploy

name = "banana-rave"
main = "src/index.js"
compatibility_date = "2026-06-01"

[[durable_objects.bindings]]
name = "RAVE"
class_name = "RaveRoom"

[[durable_objects.bindings]]
name = "PARK"
class_name = "ParkRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaveRoom"]

[[durable_objects.bindings]]
name = "BEACH"
class_name = "BeachRoom"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ParkRoom"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["BeachRoom"]

[[durable_objects.bindings]]
name = "YARDS"
class_name = "YardRoom"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["YardRoom"]

# 🏘️ Banana Town's shared life (14 Sep 2026) — one room, idFromName('the-town')
[[durable_objects.bindings]]
name = "TOWN"
class_name = "TownRoom"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["TownRoom"]

# ✉️ THE POST (20 Sep 2026) — one mailbox per player, keyed by slug, exactly like a yard.
[[durable_objects.bindings]]
name = "POST"
class_name = "PostRoom"

[[migrations]]
tag = "v6"
new_sqlite_classes = ["PostRoom"]

[vars]
ALLOWED_ORIGIN = "https://trymstene.com,http://localhost:8803,http://127.0.0.1:4321,http://localhost:4321"   # + the built-site preview the Playwright walks run on (22 Sep 2026: the first presence walk)
# 🪪 the world token rollout (2 Sep 2026). "0" = SOFT: a wrong token is
# refused, a missing one still passes (tabs on cached JS have none yet).
# Flip to "1" once /yards/stats shows wt.none at ~0 for a day: then a
# person-id claim (pass ≠ alt) without proof is refused too.
WT_ENFORCE = "1"   # flipped 2 Sep 2026 evening (Trym: "flip it")
# ✉️ THE LETTER RAIL'S KILL SWITCH, AND IT SHIPS SHUT. "1" = every /post route answers 503 before it
# reads the origin or the body. This is the plan's gate one: POST_OFF deployed and PROVEN to refuse
# before a single letter is sent. Flip to "0" only when the filter, the caps, the report and the review
# list have all been walked on the real worker.
POST_OFF = "1"
# 📮 AND THE SECOND SWITCH, which is not the same switch. "1" = free-text LETTERS are refused and
# POSTCARDS still go, because a card carries nothing anybody typed: a template id, an index into an
# approved deck, and an outfit. docs/town-jobs-plan.md §6 asks for exactly this — "the postcard
# survives a letters shutdown and has no moderation surface of its own" — so the lever to pull when
# the words become a problem is this one, and the town keeps its post.
TEXT_OFF = "0"

# 🏘️👥 the square's presence room (22 Sep 2026)
[[durable_objects.bindings]]
name = "SQUARE"
class_name = "SquareRoom"

[[migrations]]
tag = "v7"
new_sqlite_classes = ["SquareRoom"]
